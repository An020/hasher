[package]
name = "hasher"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
default-run = "hasher"
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1.4"
blake3 = { version = "1.5", features = ["rayon"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
anstream = "0.6"
indicatif = "0.17"
eframe = "0.31"
rfd = "0.15"
arboard = "3.4"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.14"
